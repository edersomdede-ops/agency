<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotacao E-mail - Converter Sabre</title>
    <style>
<style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --primary-light: #e8f0fe;
            --danger: #d93025;
            --danger-light: #fce8e6;
            --success: #1e8e3e;
            --success-light: #e6f4ea;
            --warning: #f9ab00;
            --warning-light: #fef7e0;
            --gray-50: #f8f9fa;
            --gray-100: #f1f3f4;
            --gray-200: #e8eaed;
            --gray-300: #dadce0;
            --gray-400: #bdc1c6;
            --gray-500: #9aa0a6;
            --gray-700: #5f6368;
            --gray-900: #202124;
            --sidebar-width: 260px;
            --header-height: 64px;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
            --radius: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-100);
            color: var(--gray-900);
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--gray-900);
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h1 .icon {
            font-size: 24px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 8px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-500);
            padding: 8px 12px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--gray-300);
            font-size: 14px;
            font-weight: 500;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .nav-item .badge {
            margin-left: auto;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active .badge {
            background: rgba(255,255,255,0.3);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-footer button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 12px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: var(--gray-300);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s ease;
        }

        .sidebar-footer button:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        /* Main Content */
        .main {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }

        .header {
            position: sticky;
            top: 0;
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 0 32px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-left h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .content {
            padding: 32px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .stat-icon.blue { background: var(--primary-light); }
        .stat-icon.green { background: var(--success-light); }
        .stat-icon.orange { background: var(--warning-light); }
        .stat-icon.red { background: var(--danger-light); }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        .stat-info p {
            font-size: 13px;
            color: var(--gray-700);
            margin-top: 4px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c5221f;
        }

        .btn-danger-outline {
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-danger-outline:hover {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #1a7e37;
        }

        .btn-outline {
            background: white;
            color: var(--gray-700);
            border: 1px solid var(--gray-300);
        }

        .btn-outline:hover {
            background: var(--gray-50);
            border-color: var(--gray-500);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-icon {
            padding: 8px;
            width: 36px;
            height: 36px;
            justify-content: center;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gray-200);
            flex-wrap: wrap;
            gap: 12px;
        }

        .table-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .table-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 13px;
            width: 260px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .search-box .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-500);
            font-size: 14px;
        }

        .sabre-cat-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: var(--primary-light);
            color: var(--primary-dark);
            margin-bottom: 10px;
        }
        .sabre-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }
        .sabre-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--gray-200);
        }
        .sabre-card:hover {
            box-shadow: var(--shadow-lg);
        }
        .sabre-cmd {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-dark);
            background: var(--primary-light);
            border-radius: 6px;
            padding: 6px 10px;
            display: inline-block;
            word-break: break-all;
        }
        .sabre-desc {
            font-size: 13px;
            color: var(--gray-900);
            line-height: 1.5;
        }
        .sabre-ex {
            font-size: 12px;
            color: var(--gray-700);
            background: var(--gray-50);
            border-left: 3px solid var(--primary);
            padding: 6px 10px;
            border-radius: 0 6px 6px 0;
            font-family: 'Consolas', 'Courier New', monospace;
            word-break: break-all;
        }
        .sabre-ex strong {
            color: var(--gray-900);
            font-weight: 600;
        }
        .sabre-note {
            font-size: 12px;
            color: var(--gray-700);
            line-height: 1.5;
        }
        .sabre-empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--gray-500);
            font-size: 14px;
        }

        .ct-cell {
            width: 100%;
            padding: 8px 6px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            background: transparent;
        }
        .ct-cell:hover {
            border-color: var(--gray-300);
            background: var(--gray-50);
        }
        .ct-cell:focus {
            border-color: var(--primary);
            background: white;
        }
        .ct-cell.ct-cmd {
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .ct-del {
            background: none;
            border: none;
            color: var(--gray-500);
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            padding: 4px 6px;
        }
        .ct-del:hover {
            background: var(--danger-light);
            color: var(--danger);
        }
        .ct-tarifa-line {
            font-size: 13px;
            color: var(--gray-900);
            background: var(--gray-50);
            border: 1px dashed var(--gray-300);
            border-radius: var(--radius);
            padding: 12px 16px;
            line-height: 1.6;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--gray-50);
        }

        th {
            padding: 12px 24px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-700);
            border-bottom: 1px solid var(--gray-200);
        }

        td {
            padding: 14px 24px;
            font-size: 14px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
        }

        tbody tr:hover {
            background: var(--gray-50);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .table-empty {
            text-align: center;
            padding: 60px 24px;
            color: var(--gray-500);
        }

        .table-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .table-empty p {
            font-size: 14px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.active {
            background: var(--success-light);
            color: var(--success);
        }

        .status-badge.inactive {
            background: var(--danger-light);
            color: var(--danger);
        }

        .status-badge.pending {
            background: var(--warning-light);
            color: #e37400;
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--gray-700);
            transition: background 0.15s ease;
        }

        .modal-close:hover {
            background: var(--gray-100);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            position: sticky;
            bottom: 0;
            background: white;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Tabs */
        .tabs {
            display: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Page views */
        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        /* Client card info */
        .client-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-item.full-width {
            grid-column: 1 / -1;
        }

        .detail-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 14px;
            color: var(--gray-900);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--gray-900);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            min-width: 280px;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.info { border-left: 4px solid var(--primary); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Confirm Dialog */
        .confirm-dialog .modal {
            max-width: 400px;
        }

        .confirm-dialog .modal-body {
            text-align: center;
            padding: 32px 24px;
        }

        .confirm-dialog .confirm-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .confirm-dialog .confirm-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .confirm-dialog .confirm-subtext {
            font-size: 14px;
            color: var(--gray-700);
        }

        /* Mobile */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .mobile-menu-btn {
                display: block;
            }

            .content {
                padding: 12px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                align-items: stretch;
            }

            .table-actions {
                flex-wrap: wrap;
            }

            .search-box input {
                width: 100%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .client-detail-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 6px;
            }

            .emb-hide-mobile {
                display: none;
            }

            .btn-sm {
                padding: 4px 6px;
                font-size: 12px;
            }

            #embarquesTable .action-btns,
            #embarquesTable td:last-child {
                white-space: nowrap;
            }
        }

        /* Overflow handling for table */
        .table-wrapper {
            overflow-x: auto;
        }

        /* File input hidden */
        #importInput {
            display: none;
        }

        /* Action buttons in table */
        .action-btns {
            display: flex;
            gap: 4px;
        }

        /* Highlight row */
        tbody tr.highlight {
            background: var(--primary-light);
        }

        /* Embarques checklist */
        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--gray-50);
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .checklist-item:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .checklist-item.checked {
            background: var(--success-light);
            border-color: var(--success);
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
            cursor: pointer;
            flex-shrink: 0;
        }

        .checklist-item label {
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }

        .checklist-item.checked label {
            text-decoration: line-through;
            color: var(--gray-500);
        }

        .embarque-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-200);
        }

        .embarque-header .embarque-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .embarque-header .embarque-info h4 {
            font-size: 16px;
            font-weight: 600;
        }

        .embarque-header .embarque-info p {
            font-size: 13px;
            color: var(--gray-700);
        }

        .embarque-progress {
            margin-bottom: 20px;
        }

        .embarque-progress-bar {
            width: 100%;
            height: 8px;
            background: var(--gray-200);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .embarque-progress-fill {
            height: 100%;
            background: var(--success);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .embarque-progress-label {
            font-size: 12px;
            color: var(--gray-700);
            font-weight: 500;
        }

            '7M9': 'BOEING 737 MAX 9'
        };
        const CLASS_NAMES = {
            F: 'PRIMEIRA', P: 'PRIMEIRA', R: 'PRIMEIRA', J: 'EXECUTIVA',
            C: 'EXECUTIVA', D: 'EXECUTIVA', I: 'EXECUTIVA', Z: 'EXECUTIVA',
            W: 'PREMIUM ECONOMICA', A: 'PREMIUM ECONOMICA', Y: 'ECONOMICA',
            B: 'ECONOMICA', M: 'ECONOMICA', K: 'ECONOMICA', U: 'ECONOMICA',
            H: 'ECONOMICA', Q: 'ECONOMICA', L: 'ECONOMICA', T: 'ECONOMICA',
            V: 'ECONOMICA', E: 'ECONOMICA', G: 'ECONOMICA', N: 'ECONOMICA',
            O: 'ECONOMICA', S: 'ECONOMICA', X: 'ECONOMICA'
        };
        const TZ = {
            GRU: -3, SAO: -3, CGH: -3, VCP: -3, GIG: -3, SDU: -3, BSB: -3,
            CNF: -3, POA: -3, FLN: -3, CWB: -3, SSA: -3, REC: -3, FOR: -3,
            NAT: -3, MAO: -4, BEL: -3, MCZ: -3, JPA: -3, AJU: -3, VIX: -3,
            GOJ: -3, CGB: -4, PMW: -3, SLZ: -3, EZE: -3, AEP: -3, MVD: -3,
            ASU: -4, SCL: '-3:cl', LIM: -5, BOG: -5, UIO: -5, GYE: -5,
            CCS: -4, MEX: -6, CUN: -5, PUJ: -4, HAV: -5, SJO: -6, PTY: -5,
            MIA: '-5:us', MCO: '-5:us', ORL: '-5:us', JFK: '-5:us',
            EWR: '-5:us', BOS: '-5:us', IAD: '-5:us', ATL: '-5:us',
            ORD: '-6:us', IAH: '-6:us', DFW: '-6:us', DEN: '-7:us',
            LAX: '-8:us', SFO: '-8:us', SEA: '-8:us', LAS: '-8:us',
            SLC: '-7:us', LIS: '0:eu', OPO: '0:eu', MAD: '1:eu', BCN: '1:eu',
            CDG: '1:eu', ORY: '1:eu', FRA: '1:eu', MUC: '1:eu', LHR: '0:eu',
            LGW: '0:eu', AMS: '1:eu', BRU: '1:eu', ZRH: '1:eu', VIE: '1:eu',
            ATH: '2:eu', FCO: '1:eu', MXP: '1:eu', DUB: '0:eu', BUD: '1:eu',
            PRG: '1:eu', WAW: '1:eu', CPH: '1:eu', ARN: '1:eu', HEL: '2:eu',
            IST: 3, DOH: 3, AUH: 4, DXB: 4, DMM: 3, RUH: 3, JNB: 2, CPT: 2,
            CAI: 2, LAD: 1, SIN: 8, BKK: 7, HKG: 8, KUL: 8, NRT: 9, HND: 9,
            ICN: 9, PVG: 8, PEK: 8, MNL: 8, TPE: 8, SGN: 7, HAN: 7, DPS: 8,
            CGK: 7, DEL: 5.5, BOM: 5.5, SYD: '10:au', MEL: '10:au',
            BNE: '10:au', PER: 8, AKL: 12
        };
        const DIAS_PT = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERCA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SABADO'];
        const MESES = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
        const MESES_RX = 'JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC';

        let cotacaoRows = [];
        let ctLastTarifaLine = '';

        function ctEsc(v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function ctParseNum(v) {
            if (v == null) return 0;
            return parseFloat(String(v).replace(/\./g, '').replace(',', '.')) || 0;
        }
        function ctParseCambio(v) {
            if (v == null) return 0;
            const s = String(v).trim();
            if (!s) return 0;
            if (s.indexOf(',') >= 0) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
            const parts = s.split('.');
            if (parts.length === 2) return parseFloat(s) || 0;
            if (parts.length > 2) return parseFloat(s.replace(/\./g, '')) || 0;
            return parseFloat(s) || 0;
        }
        function ctFmtCurrency(v) {
            if (String(v).trim() === '') return 'XXX,XX';
            const n = ctParseNum(v);
            return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function ctGetMonth(dateStr) {
            const m = String(dateStr || '').match(new RegExp('(' + MESES_RX + ')', 'i'));
            return m ? MESES[m[1].toUpperCase()] : null;
        }
        function ctDiaSemana(dateStr, year) {
            const m = String(dateStr || '').match(new RegExp('^(\\d{2})(' + MESES_RX + ')$', 'i'));
            if (!m) return '';
            const d = new Date(year, MESES[m[2].toUpperCase()], +m[1]);
            return DIAS_PT[d.getDay()];
        }
        function ctTz(code, month) {
            let v = TZ[code];
            if (v === undefined) return null;
            let base = v, dst = null;
            if (typeof v === 'string') {
                const parts = v.split(':');
                base = parseFloat(parts[0]);
                dst = parts[1];
            }
            const m1 = month + 1;
            if (dst === 'us' || dst === 'eu') return (m1 >= 4 && m1 <= 10) ? base + 1 : base;
            if (dst === 'au') return (m1 >= 11 || m1 <= 3) ? base + 1 : base;
            if (dst === 'cl') return (m1 >= 10 || m1 <= 3) ? base + 1 : base;
            return base;
        }
        function ctToMin(t) {
            return (+t.slice(0, 2)) * 60 + (+t.slice(2, 4));
        }
        function ctDuracao(dep, arr, orig, dest, month, nextDay) {
            const o = ctTz(orig, month), d = ctTz(dest, month);
            let depM = ctToMin(dep), arrM = ctToMin(arr);
            if (nextDay) arrM += 1440;
            let dur;
            if (o == null || d == null) {
                dur = arrM - depM;
                if (dur < 0) dur += 1440;
            } else {
                dur = (arrM + (o - d) * 60) - depM;
                if (dur < 0) dur += 1440;
            }
            return Math.floor(dur / 60) + '.' + String(dur % 60).padStart(2, '0');
        }
        function ctMakeRow(seg) {
            const date = seg.date || '';
            const month = ctGetMonth(date);
            const nextDay = !!seg.nextDate;
            const dur = (seg.dep && seg.arr && month != null) ? ctDuracao(seg.dep, seg.arr, seg.orig, seg.dest, month, nextDay) : '';
            return {
                date: date,
                semana: ctDiaSemana(date, seg.year),
                cia: AIRLINES[seg.cia] || seg.cia || '',
                voo: seg.flight || '',
                classe: (seg.cls ? seg.cls + ' - ' + (CLASS_NAMES[seg.cls] || 'ECONOMICA') : ''),
                origem: AIRPORTS[seg.orig] || seg.orig || '',
                destino: AIRPORTS[seg.dest] || seg.dest || '',
                saida: seg.dep || '',
                chegada: seg.arr ? (nextDay ? seg.arr + ' (' + seg.nextDate + ')' : seg.arr) : '',
                duracao: dur,
                aeronave: AIRCRAFT[seg.equip] || seg.equip || '',
                escalas: seg.stops != null ? String(seg.stops) : '0'
            };
        }
        function parseSabreToRows(text) {
            const rows = [];
            const year = parseInt(document.getElementById('ctYear').value, 10) || new Date().getFullYear();
            const defDate = (document.getElementById('ctDefaultDate').value || '').trim().toUpperCase();
            let curDate = defDate;
            const lines = String(text).split(/\r?\n/);
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const dm = line.match(new RegExp('^(\\d{2})(' + MESES_RX + ')\\b', 'i'));
                if (dm && !line.match(/^(\d{1,2})\./) && !line.match(/^\d{1,2}\.?[A-Z]{2}\d/)) {
                    curDate = dm[1] + dm[2].toUpperCase();
                    continue;
                }
                let m = line.match(/^(\d{1,2})\.?\s*([A-Z0-9]{2})\s*(\d{1,4})\s*([A-Z])\s+(\d{2}[A-Z]{3})\s+\S+\s*([A-Z]{3})\s*([A-Z]{3})(?:(?:\*([A-Z]{2})|\s+([A-Z]{2}))\s*\d)?\s+(\d{4})\s+(\d{4})(?:\s+(\d{2}[A-Z]{3})(?:\s+\d+)?)?(?:\s+(\d{3})(?:\s+(\d))?)?(?:\s+\S+)?\s*(?:\/.*)?$/);
                if (m) {
                    rows.push(ctMakeRow({ date: m[5], cia: m[2], flight: m[3], cls: m[4], orig: m[6], dest: m[7], dep: m[10], arr: m[11], nextDate: m[12], stops: m[14] || '0', equip: m[13] || '', year: year }));
                    continue;
                }
                m = line.match(/^(\d{1,2})\.?\s*([A-Z0-9]{2})(\d{1,4})\s+(.+?)\s+([A-Z]{3})([A-Z]{3})\s+\S+\s+(\d{4})\s+(\d{4})\s+(\S+)\s+\S+\s+(\d)\s+/);
                if (m) {
                    const cls = (m[4].match(/[A-Z]/) || [''])[0];
                    rows.push(ctMakeRow({ date: curDate, cia: m[2], flight: m[3], cls: cls, orig: m[5], dest: m[6], dep: m[7], arr: m[8], equip: m[9], stops: m[10], year: year }));
                    continue;
                }
            }
            return rows;
        }
        function renderCotacaoTable() {
            const tbody = document.getElementById('ctTableBody');
            if (!cotacaoRows.length) {
                tbody.innerHTML = '<tr><td colspan="13" class="table-empty"><div class="empty-icon">📧</div><p>Nenhum trecho. Cole os voos do Sabre e clique em "Converter Voos".</p></td></tr>';
                document.getElementById('statCtVoos').textContent = '0';
                document.getElementById('statCtCias').textContent = '0';
                document.getElementById('statCtRota').textContent = '-';
                return;
            }
            tbody.innerHTML = cotacaoRows.map(function(r, i) {
                return '<tr>' +
                    '<td><input class="ct-cell ct-cmd" data-i="' + i + '" data-f="date" value="' + ctEsc(r.date) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell" data-i="' + i + '" data-f="semana" value="' + ctEsc(r.semana) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell" data-i="' + i + '" data-f="cia" value="' + ctEsc(r.cia) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell ct-cmd" data-i="' + i + '" data-f="voo" value="' + ctEsc(r.voo) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell" data-i="' + i + '" data-f="classe" value="' + ctEsc(r.classe) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell" data-i="' + i + '" data-f="origem" value="' + ctEsc(r.origem) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell" data-i="' + i + '" data-f="destino" value="' + ctEsc(r.destino) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell ct-cmd" data-i="' + i + '" data-f="saida" value="' + ctEsc(r.saida) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell ct-cmd" data-i="' + i + '" data-f="chegada" value="' + ctEsc(r.chegada) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell ct-cmd" data-i="' + i + '" data-f="duracao" value="' + ctEsc(r.duracao) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell" data-i="' + i + '" data-f="aeronave" value="' + ctEsc(r.aeronave) + '" oninput="ctCell(this)"></td>' +
                    '<td><input class="ct-cell ct-cmd" data-i="' + i + '" data-f="escalas" value="' + ctEsc(r.escalas) + '" oninput="ctCell(this)"></td>' +
                    '<td><button class="ct-del" onclick="removeCotacaoRow(' + i + ')" title="Remover">✕</button></td>' +
                    '</tr>';
            }).join('');
            const cias = {};
            cotacaoRows.forEach(function(r) { if (r.cia) cias[r.cia] = true; });
            document.getElementById('statCtVoos').textContent = cotacaoRows.length;
            document.getElementById('statCtCias').textContent = Object.keys(cias).length;
            const orig = cotacaoRows.find(function(r) { return r.origem; });
            const dest = cotacaoRows.slice().reverse().find(function(r) { return r.destino; });
            document.getElementById('statCtRota').textContent = (orig ? orig.origem.split(' - ')[0] : '') + ' / ' + (dest ? dest.destino.split(' - ')[0] : '');
        }
        function ctCell(inp) {
            const i = +inp.dataset.i, f = inp.dataset.f;
            if (cotacaoRows[i]) cotacaoRows[i][f] = inp.value;
        }
        function removeCotacaoRow(i) {
            cotacaoRows.splice(i, 1);
            renderCotacaoTable();
        }
        function addCotacaoRow() {
            cotacaoRows.push({ date: '', semana: '', cia: '', voo: '', classe: '', origem: '', destino: '', saida: '', chegada: '', duracao: '', aeronave: '', escalas: '0' });
            renderCotacaoTable();
        }
        function clearCotacao() {
            document.getElementById('ctPaste').value = '';
            cotacaoRows = [];
            renderCotacaoTable();
            showToast('Área limpa.', 'info');
        }
        let ctTimer = null;
        function scheduleCotacao() {
            clearTimeout(ctTimer);
            ctTimer = setTimeout(convertCotacao, 500);
        }
        function convertCotacao() {
            const text = document.getElementById('ctPaste').value;
            if (!text.trim()) {
                cotacaoRows = [];
                renderCotacaoTable();
                return;
            }
            const rows = parseSabreToRows(text);
            if (rows.length) {
                cotacaoRows = rows;
                renderCotacaoTable();
                showToast(rows.length + ' trecho(s) convertido(s)!', 'success');
            } else {
                showToast('Nenhum trecho reconhecido. Cole do itinerário do PNR (após ER/IR) ou da disponibilidade do Sabre.', 'error');
            }
        }
        function renderCotacaoTarifa() {
            const tipo = document.getElementById('ctTarTipo').value;
            const val = document.getElementById('ctTarValor').value;
            const taxas = document.getElementById('ctTarTaxas').value;
            const cambio = document.getElementById('ctTarCambio').value;
            const bag = document.getElementById('ctTarBag').value;
            const valN = ctParseNum(val);
            const taxasN = ctParseNum(taxas);
            const totalN = valN + taxasN;
            const cambioN = ctParseCambio(cambio);
            const brlN = totalN * cambioN;
            const hasVal = String(val).trim() !== '' || String(taxas).trim() !== '';
            const totalEl = document.getElementById('ctTarTotal');
            const brlEl = document.getElementById('ctTarTotalBRL');
            const fmtNum = function(n) { return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
            if (totalEl) totalEl.value = hasVal ? fmtNum(totalN) : '';
            if (brlEl) brlEl.value = hasVal && cambioN > 0 ? fmtNum(brlN) : '';
            ctLastTarifaLine = 'Tarifa *' + tipo + '*.....USD ' + ctFmtCurrency(hasVal ? val : '') + ' + USD ' + ctFmtCurrency(hasVal ? taxas : '') + ' taxas = Total USD ' + (hasVal ? fmtNum(totalN) : 'XXX,XX') + ' /BRL ' + (hasVal && cambioN > 0 ? fmtNum(brlN) : 'XXX,XX') + ' (' + bag + ')';
            const el = document.getElementById('ctTarifaPreview');
            if (el) el.innerHTML = '<div class="ct-tarifa-line"><strong>Linha da tarifa (colada no e-mail):</strong><br>' + ctEsc(ctLastTarifaLine) + '</div>';
        }
        function ctGetRows() {
            return cotacaoRows.map(function(r) {
                return { date: r.date || '', semana: r.semana || '', cia: r.cia || '', voo: r.voo || '', classe: r.classe || '', origem: r.origem || '', destino: r.destino || '', saida: r.saida || '', chegada: r.chegada || '', duracao: r.duracao || '', aeronave: r.aeronave || '', escalas: r.escalas || '' };
            });
        }
        function ctBuildHtmlTable() {
            const rows = ctGetRows();
            const head = ['DATA', 'SEMANA', 'CIA. AEREA', 'VOO', 'CLASSE', 'ORIGEM', 'DESTINO', 'SAIDA', 'CHEGADA', 'DURACAO', 'AERONAVE', 'ESCALAS'];
            let html = '<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:12px;">';
            html += '<thead><tr style="background:#1a73e8;color:#ffffff;">' + head.map(function(h) { return '<th style="padding:6px 10px;text-align:left;">' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
            rows.forEach(function(r) {
                html += '<tr>' + [r.date, r.semana, r.cia, r.voo, r.classe, r.origem, r.destino, r.saida, r.chegada, r.duracao, r.aeronave, r.escalas].map(function(v) { return '<td style="padding:6px 10px;border:1px solid #dadce0;">' + ctEsc(v) + '</td>'; }).join('') + '</tr>';
            });
            html += '</tbody></table>';
            return html;
        }
        function ctBuildPlainTable() {
            const rows = ctGetRows();
            const head = ['DATA', 'SEMANA', 'CIA. AEREA', 'VOO', 'CLASSE', 'ORIGEM', 'DESTINO', 'SAIDA', 'CHEGADA', 'DURACAO', 'AERONAVE', 'ESCALAS'];
            const lines = [head.join('\t')];
            rows.forEach(function(r) {
                lines.push([r.date, r.semana, r.cia, r.voo, r.classe, r.origem, r.destino, r.saida, r.chegada, r.duracao, r.aeronave, r.escalas].join('\t'));
            });
            return lines.join('\n');
        }
        async function ctCopy(html, text) {
            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    const item = new ClipboardItem({
                        'text/html': new Blob([html], { type: 'text/html' }),
                        'text/plain': new Blob([text], { type: 'text/plain' })
                    });
                    await navigator.clipboard.write([item]);
                    return true;
                }
            } catch (e) {}
            try {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const div = document.createElement('div');
                div.innerHTML = html;
                div.contentEditable = 'true';
                div.style.position = 'fixed';
                div.style.left = '-9999px';
                div.style.top = '0';
                div.style.width = '1px';
                document.body.appendChild(div);
                const range = document.createRange();
                range.selectNodeContents(div);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                const ok = document.execCommand('copy');
                sel.removeAllRanges();
                div.remove();
                if (ok) return true;
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                ta.remove();
                return ok;
            } catch (e) {
                return false;
            }
        }
        async function copiarCotacaoHtml(withTarifa) {
            if (!cotacaoRows.length) { showToast('Nenhum trecho convertido ainda.', 'error'); return; }
            let html = ctBuildHtmlTable();
            let text = ctBuildPlainTable();
            if (withTarifa && ctLastTarifaLine) {
                html += '<p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;">' + ctEsc(ctLastTarifaLine) + '</p>';
                text += '\n\n' + ctLastTarifaLine;
            }
            const ok = await ctCopy(html, text);
            showToast(ok ? 'Copiado! Cole no e-mail (Ctrl+V).' : 'Não foi possível copiar.', ok ? 'success' : 'error');
        }
        async function copiarCotacaoTexto() {
            if (!cotacaoRows.length) { showToast('Nenhum trecho convertido ainda.', 'error'); return; }
            let text = ctBuildPlainTable();
            if (ctLastTarifaLine) text += '\n\n' + ctLastTarifaLine;
            const ok = await ctCopy(text, text);
            showToast(ok ? 'Texto copiado!' : 'Não foi possível copiar.', ok ? 'success' : 'error');
        }

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;

            const icons = { success: '✓', error: '✕', info: 'ℹ' };
            toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> ${message}`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            const ctYear = document.getElementById('ctYear');
            if (ctYear) ctYear.value = new Date().getFullYear();
            renderCotacaoTable();
            renderCotacaoTarifa();
            const cd = document.getElementById('currentDate');
            if (cd) cd.textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
        });
    </script>
